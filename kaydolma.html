<!DOCTYPE html>


<html lang="tr">
<head>
        <meta charset="UTF-8">
        <title>Bookboxd'ye kayıt olun</title>
        <style type="text/css">
            
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                background-color: gray;
                font-family: Arial, sans-serif;
                background-image: url(galeri/e34e5e7ff111c036541f1efa3161b137.jpg);
                background-repeat: no-repeat;
                background-position: center center;
                background-size: cover;
                background-attachment: fixed;
            
            }


            
            .login-kutusu {
                width: 600px;
                height: 420px;
                background-color: rgb(77, 60, 49);

                padding: 20px;
                border-radius: 10px;
                box-shadow: 15px 15px 20px rgb(0, 0, 0);
                text-align: center;
                margin-right: 30px;



            }
            
            h1 {

                color:rgb(164, 139, 129);
                font-style: italic;
                font-size: 35px;
                margin-top: 0;
                margin-bottom: 20px;
                text-shadow: 1px 1px 2px black;
                margin-right: 50px;
            }

            table {
                width: 100%;
            
            }

            td {
            padding: 10px; 
            text-align: left;
            font-size: 30px;
            font-style: italic;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: rgb(187, 162, 141);
            }   
            

            .buton-satiri {
                text-align: center;
                font-size: 30px;
            }
            
            input[type="text"], input[type="password"] {
                font-size: 18px;
                padding: 8px; 
                width: 250px;
            }
            input[type="submit"] {
                font-size: 20px;
                padding: 10px 30px;
            }   
            

        </style>

</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; ">
        
        <div class="login-kutusu">
    
    
            <h1>Kayıt olun</h1>

      
        <form action="girişyap.html" onsubmit="return kontrolEt()"> <table>
                <tr>
                    <td>İsim giriniz:</td>
                    <td><input type="text" placeholder="İsim giriniz"></td>
                </tr>

                <tr>
                    <td>Soyadı giriniz:</td>
                    <td><input type="text" placeholder="Soyadı giriniz"></td>
                </tr>

                <tr>
                    <td>Kullanıcı adı giriniz:</td>
                    <td><input type="text" placeholder="Kullanıcı adı giriniz"></td>
                </tr>

                <tr>
                    <td>Şifre giriniz:</td>
                    <td><input type="password" placeholder="Şifre giriniz"></td>
                </tr>
                
                <tr>
                    <td colspan="2" style="text-align: left;">
                        <input type="checkbox"> Beni Hatırla
                            
                            
                            
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="buton-satiri">
                        <input type="submit" value="Gönder" style="padding: 5px 20px; cursor: pointer;">
                    </td>
                </tr>
            </table>
        </form>
    
    </div> 
    
    <script>
    function kontrolEt(){
        
        const tumInputlar = document.querySelectorAll('input[type="text"]');
        
        const isim = tumInputlar[0].value.trim();   
        const soyad = tumInputlar[1].value.trim();   
        const KullaniciAdi = tumInputlar[2].value.trim(); 
        const sifre = document.querySelector('input[type="password"]').value.trim();

        const harfDeseni = /^[a-zA-ZçÇğĞıİöÖşŞüÜ\s]+$/;

        
        if(isim === "" || soyad === "" || KullaniciAdi === "" || sifre === "" ){
            alert("Lütfen bilgileri doldurunuz!");
            return false;
        }

       
        if(isim.length > 25){
            alert("İsim 25 karakterden uzun olamaz!");
            return false;
        }
        if(!harfDeseni.test(isim)){
            alert("İsminizi özel karakter ve sayı kullanmadan giriniz!");
            return false;
        }

       
        if(soyad.length > 25){
            alert("Soyad 25 karakterden uzun olamaz!");
            return false;
        }
        if(!harfDeseni.test(soyad)){
            alert("Soyadınızı özel karakter ve sayı kullanmadan giriniz!");
            return false;
        }

        
        if(KullaniciAdi.length > 25){
            alert("Kullanıcı adı 25 karakterden uzun olamaz!");
            return false;
        }

        
        if(sifre.length < 6 || sifre.length > 30){
            alert("Şifreniz 6 ile 30 karakter arasında olmalıdır!");
            return false;
        }

        alert("Kaydınız tamamlanıyor...");
        return true;
    }
    </script>
    </body>
</html>
